<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cl-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    
    <linearGradient id="cl-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#64748B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Platinum Metallic Gradient for C -->
    <linearGradient id="cl-platinum-c" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Platinum Metallic Gradient for L -->
    <linearGradient id="cl-platinum-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Vibrant Electric Teal for Growth Notch -->
    <linearGradient id="cl-teal-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Shadow filters -->
    <filter id="cl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="cl-radial-glow" cx="65%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#cl-bg-grad)" />
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#cl-radial-glow)" />
  <rect x="6.75" y="6.75" width="114.5" height="114.5" rx="27.25" stroke="url(#cl-border-grad)" stroke-width="1.5" />

  <!-- Monogram Interlocking C & L Group -->
  <g transform="translate(6, 4)">
    <!-- Interlocking "C" Loop: Sweeps gracefully counterclockwise from top right, around to the base of L -->
    <path
      d="M 80 40 
         C 80 27, 68 18, 52 18 
         C 32 18, 20 32, 20 58 
         C 20 82, 34 96, 56 96 
         C 72 96, 85 86, 90 75
         L 79 69
         C 75 77, 67 84, 56 84
         C 40 84, 32 72, 32 58
         C 32 40, 41 30, 52 30
         C 63 30, 69 35, 70 40
         Z"
      fill="url(#cl-platinum-c)"
    />

    <!-- Vertical Stem of "L" interlocking through C -->
    <path
      d="M 52 24
         L 64 24
         L 64 74
         C 64 78, 68 84, 76 84
         L 96 84
         L 96 96
         L 72 96
         C 58 96, 52 86, 52 74
         Z"
      fill="url(#cl-platinum-l)"
    />

    <!-- Upward Diagonal Notch / Growth Arrowhead at the junction (45-degree forward trajectory) -->
    <path
      d="M 64 54
         L 86 32
         L 74 32
         L 74 24
         L 98 24
         L 98 48
         L 90 48
         L 90 36
         L 68 58
         Z"
      fill="url(#cl-teal-glow)"
      filter="url(#cl-glow)"
    />

    <!-- Subtle Geometric Intersection Accent -->
    <circle cx="64" cy="54" r="3" fill="#22D3EE" />
  </g>
</svg>
